<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadro da portaria · Lombada Educativa</title>
  <meta name="description" content="Última passagem na lombada, ao vivo, para o PC da portaria.">
  <meta name="theme-color" content="#070A10">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/portaria/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/quadro/quadro.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ic-casa" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-5.5h4V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-chave" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 12 20 3M16 7l3 3M14 9l2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-cracha" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 17c.8-2 2.2-3 4-3s3.2 1 4 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-ferramenta" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0 4.8 4.8L11 19.6a2.1 2.1 0 0 1-3-3l8.3-8.3A4 4 0 0 0 14.5 6.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="ic-interrogacao" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-alfinete" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6ZM12 15v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-minimizar" viewBox="0 0 24 24"><path d="M6 17h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M12 6h.01M12 12h.01M12 18h.01" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="ic-esq" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-dir" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <!-- Barra fina do topo: arrastar (no programa do PC: Windows ou Mac), estado, Fixar, minimizar e menu -->
  <header class="barra" id="barra" data-tauri-drag-region>
    <span class="estado" id="estado" data-tauri-drag-region><i aria-hidden="true"></i><span id="estado-texto">Quadro</span></span>
    <span class="barra-titulo" id="barra-titulo" data-tauri-drag-region></span>
    <button type="button" class="ic-btn" id="botao-fixar" hidden aria-pressed="false" title="Fixar o quadro nesta posição" aria-label="Fixar o quadro nesta posição"><svg aria-hidden="true"><use href="#ic-alfinete"></use></svg><span class="rot-fixar">Fixar</span></button>
    <button type="button" class="ic-btn" id="botao-minimizar" hidden title="Minimizar" aria-label="Minimizar"><svg aria-hidden="true"><use href="#ic-minimizar"></use></svg></button>
    <button type="button" class="ic-btn" id="botao-menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="Menu" aria-label="Menu"><svg aria-hidden="true"><use href="#ic-menu"></use></svg></button>
  </header>

  <div class="menu" id="menu" hidden>
    <label class="menu-linha" for="menu-camera">Câmera deste PC
      <select id="menu-camera" class="campo"><option value="">Todas as câmeras</option></select>
    </label>
    <label class="menu-linha menu-check" id="menu-autostart-linha" hidden>
      <input type="checkbox" id="menu-autostart"> Abrir ao ligar o computador
    </label>
    <button type="button" class="menu-item" id="menu-painel">Abrir o painel completo</button>
    <button type="button" class="menu-item" id="menu-trocar" hidden>Trocar de condomínio</button>
    <a class="menu-item" id="menu-manual" href="/dashboard/manual.html#quadro-pc" target="_blank" rel="noopener">Manual do quadro</a>
    <button type="button" class="menu-item" id="menu-sair">Sair</button>
  </div>

  <main class="conteudo">
    <section id="tela-carregando" class="tela centro" aria-live="polite">
      <p id="carregando-texto">Carregando…</p>
      <button type="button" id="botao-tentar" class="botao" hidden>Tentar de novo</button>
    </section>

    <section id="tela-login" class="tela" hidden aria-labelledby="titulo-login">
      <h1 id="titulo-login">Quadro da portaria</h1>
      <form id="form-login" class="form-login" novalidate>
        <label class="visualmente-oculto" for="login-usuario">Usuário ou e-mail</label>
        <input id="login-usuario" class="campo" type="text" placeholder="Usuário ou e-mail" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <label class="visualmente-oculto" for="login-senha">Senha</label>
        <input id="login-senha" class="campo" type="password" placeholder="Senha" autocomplete="current-password" required>
        <div id="captcha-login" class="captcha-box"></div>
        <p id="login-erro" class="erro" role="alert"></p>
        <button type="submit" id="botao-entrar" class="botao primario">Entrar</button>
      </form>
    </section>

    <section id="tela-escolha" class="tela" hidden aria-labelledby="titulo-escolha">
      <h1 id="titulo-escolha">Qual condomínio?</h1>
      <label class="visualmente-oculto" for="escolha-cliente">Condomínio</label>
      <select id="escolha-cliente" class="campo"></select>
      <p id="escolha-erro" class="erro" role="alert"></p>
      <button type="button" id="botao-escolher" class="botao primario">Abrir</button>
    </section>

    <section id="tela-aviso" class="tela centro" hidden>
      <p id="aviso-texto">Este login não tem acesso ao quadro.</p>
      <button type="button" class="botao" data-acao="sair">Sair</button>
    </section>

    <section id="tela-quadro" class="tela-quadro" hidden aria-label="Última passagem">
      <button type="button" class="passagem" id="passagem" aria-describedby="dica-clique">
        <span class="foto" id="foto"><span class="sem-foto">Sem foto</span></span>
        <span class="info">
          <span class="linha-placa"><span class="mer"><i></i><b id="p-placa"></b></span><span class="vel" id="p-vel"></span></span>
          <span class="selo" id="p-tipo"></span>
          <span class="nome" id="p-nome"></span>
          <span class="unidade" id="p-unidade"></span>
          <span class="onde"><span id="p-camera"></span> · <span class="mono" id="p-hora"></span></span>
        </span>
      </button>
      <p class="vazio" id="vazio" hidden>Nenhuma passagem hoje ainda.</p>
      <span class="visualmente-oculto" id="dica-clique">Clique para abrir o painel completo de hoje.</span>
      <nav class="nav" aria-label="Passagens de hoje">
        <button type="button" class="ic-btn nav-btn" id="botao-voltar" aria-label="Passagem anterior" title="Passagem anterior"><svg aria-hidden="true"><use href="#ic-esq"></use></svg></button>
        <span class="nav-meio" id="nav-posicao" aria-live="polite"></span>
        <button type="button" class="nav-vivo" id="botao-ao-vivo" hidden>Voltar ao vivo</button>
        <button type="button" class="ic-btn nav-btn" id="botao-avancar" aria-label="Passagem seguinte" title="Passagem seguinte"><svg aria-hidden="true"><use href="#ic-dir"></use></svg></button>
      </nav>
    </section>
  </main>

  <script src="/js/placa.js"></script>
  <script src="/js/captcha.js"></script>
  <script src="/js/usuario-portaria.js"></script>
  <script src="/js/vinculo-placa.js"></script>
  <script src="/js/unidade.js"></script>
  <script src="/js/miniatura.js"></script>
  <script src="/js/severidade-velocidade.js"></script>
  <script src="/js/painel-visual.js"></script>
  <script src="/js/acesso-painel.js"></script>
  <script src="/js/quadro.js"></script>
  <script src="/quadro/casca.js"></script>
  <script src="/quadro/app.js"></script>
</body>
</html>
