# Programa do Windows do Quadro da portaria (quadro-windows/, Tauri v2).
# Tag quadro-v* → compila o instalador NSIS e anexa Quadro-Lombada-Setup.exe
# (e o .sha256) ao Release da tag (o painel baixa por /baixar/quadro-windows →
# releases/latest/download/Quadro-Lombada-Setup.exe).
# workflow_dispatch → só compila e guarda o instalador como artefato do run.
# Dois jobs: a compilação roda só com leitura; quem publica (escrita) só baixa
# o artefato pronto, sem rodar código do repositório.
# Sem assinatura de código por enquanto: o Windows mostra o aviso do
# SmartScreen ("Mais informações → Executar assim mesmo").
name: Quadro para Windows

on:
  push:
    tags: ['quadro-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quadro-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  # Toolchain fixa (a mesma usada para validar a casca); trocar de propósito.
  RUST_VERSAO: '1.99.1'

jobs:
  compilar:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: quadro-windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quadro-windows/package-lock.json

      - name: Rust ${{ env.RUST_VERSAO }} (rustup do runner)
        run: |
          rustup toolchain install $env:RUST_VERSAO --profile minimal
          rustup default $env:RUST_VERSAO
          rustc --version

      - name: Dependências (versões travadas)
        run: npm ci

      - name: Testes da casca
        working-directory: quadro-windows/src-tauri
        run: cargo test --locked

      - name: Compilar instalador NSIS
        run: npx tauri build --bundles nsis -- --locked

      - name: Nome estável e SHA256 do instalador
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw 'instalador NSIS não encontrado' }
          Copy-Item $exe.FullName -Destination Quadro-Lombada-Setup.exe
          $hash = (Get-FileHash Quadro-Lombada-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Quadro-Lombada-Setup.exe" | Out-File -FilePath Quadro-Lombada-Setup.exe.sha256 -Encoding ascii -NoNewline
          Get-Content Quadro-Lombada-Setup.exe.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quadro-Lombada-Setup
          path: |
            quadro-windows/Quadro-Lombada-Setup.exe
            quadro-windows/Quadro-Lombada-Setup.exe.sha256
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/quadro-v')
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Quadro-Lombada-Setup
          path: instalador

      - name: Conferir o SHA256 do artefato
        working-directory: instalador
        run: sha256sum -c Quadro-Lombada-Setup.exe.sha256

      - name: Release da tag (cria ou atualiza)
        working-directory: instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Quadro da portaria $TAG" \
              --notes "Instalador do Quadro da portaria para Windows. Baixe pelo painel: menu da conta > Quadro para o PC da portaria. SHA256 em Quadro-Lombada-Setup.exe.sha256." \
              --latest
          fi
          gh release upload "$TAG" Quadro-Lombada-Setup.exe Quadro-Lombada-Setup.exe.sha256 --clobber
