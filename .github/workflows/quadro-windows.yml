# Programa do PC do Quadro da portaria (quadro-windows/, Tauri v2): Windows e macOS.
# Tag quadro-v* → compila o instalador NSIS (Quadro-Lombada-Setup.exe) e o
# .dmg universal do Mac (Quadro-Lombada-Mac.dmg, Intel + Apple Silicon) e anexa
# os dois (com .sha256) ao Release da tag. O painel baixa por
# /baixar/quadro-windows e /baixar/quadro-macos → releases/latest/download/….
# Atualização automática: os pacotes saem assinados (TAURI_SIGNING_PRIVATE_KEY
# e _PASSWORD, segredos do repositório; a chave pública está no
# tauri.conf.json) e o Release ganha latest.json, que o programa instalado
# consulta (releases/latest/download/latest.json) para se atualizar sozinho.
# A tag precisa bater com a versão do tauri.conf.json (quadro-vX.Y.Z).
# workflow_dispatch → só compila e guarda os instaladores como artefatos do run.
# A compilação roda só com leitura; quem publica (escrita) só baixa os
# artefatos prontos, sem rodar código do repositório.
# Sem assinatura de código por enquanto: o Windows mostra o aviso do
# SmartScreen ("Mais informações → Executar assim mesmo"); o Mac leva
# assinatura ad-hoc (sem notarização) e pede "Abrir Mesmo Assim" em
# Ajustes do Sistema › Privacidade e Segurança.
name: Quadro para Windows e macOS

on:
  push:
    tags: ['quadro-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quadro-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  # Toolchain fixa (a mesma usada para validar a casca); trocar de propósito.
  RUST_VERSAO: '1.99.1'

jobs:
  compilar:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: quadro-windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quadro-windows/package-lock.json

      - name: Rust ${{ env.RUST_VERSAO }} (rustup do runner)
        run: |
          rustup toolchain install $env:RUST_VERSAO --profile minimal
          rustup default $env:RUST_VERSAO
          rustc --version

      - name: Dependências (versões travadas)
        run: npm ci

      - name: Testes da casca
        working-directory: quadro-windows/src-tauri
        run: cargo test --locked

      - name: Compilar instalador NSIS (assinado para a atualização)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis -- --locked

      - name: Nome estável e SHA256 do instalador
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw 'instalador NSIS não encontrado' }
          Copy-Item $exe.FullName -Destination Quadro-Lombada-Setup.exe
          Copy-Item "$($exe.FullName).sig" -Destination Quadro-Lombada-Setup.exe.sig
          $hash = (Get-FileHash Quadro-Lombada-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Quadro-Lombada-Setup.exe" | Out-File -FilePath Quadro-Lombada-Setup.exe.sha256 -Encoding ascii -NoNewline
          Get-Content Quadro-Lombada-Setup.exe.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quadro-Lombada-Setup
          path: |
            quadro-windows/Quadro-Lombada-Setup.exe
            quadro-windows/Quadro-Lombada-Setup.exe.sha256
            quadro-windows/Quadro-Lombada-Setup.exe.sig
          if-no-files-found: error

  compilar-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: quadro-windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quadro-windows/package-lock.json

      - name: Rust ${{ env.RUST_VERSAO }} com os dois alvos do Mac
        run: |
          rustup toolchain install "$RUST_VERSAO" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default "$RUST_VERSAO"
          rustc --version

      - name: Tag igual à versão do programa
        if: startsWith(github.ref, 'refs/tags/quadro-v')
        run: |
          versao=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "quadro-v$versao" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME ≠ versão $versao do tauri.conf.json"; exit 1; }

      - name: Dependências (versões travadas)
        run: npm ci

      - name: Testes da casca
        working-directory: quadro-windows/src-tauri
        run: cargo test --locked

      - name: Compilar .dmg e pacote de atualização (universal, assinado)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg -- --locked

      - name: Nome estável e SHA256 do .dmg
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          [ -n "$dmg" ] || { echo '.dmg não encontrado'; exit 1; }
          cp "$dmg" Quadro-Lombada-Mac.dmg
          pacote=$(ls src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz | head -n 1)
          [ -n "$pacote" ] || { echo 'pacote de atualização não encontrado'; exit 1; }
          cp "$pacote" Quadro-Lombada-Mac.app.tar.gz
          cp "$pacote.sig" Quadro-Lombada-Mac.app.tar.gz.sig
          shasum -a 256 Quadro-Lombada-Mac.dmg | tr -d '\n' > Quadro-Lombada-Mac.dmg.sha256
          cat Quadro-Lombada-Mac.dmg.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quadro-Lombada-Mac
          path: |
            quadro-windows/Quadro-Lombada-Mac.dmg
            quadro-windows/Quadro-Lombada-Mac.dmg.sha256
            quadro-windows/Quadro-Lombada-Mac.app.tar.gz
            quadro-windows/Quadro-Lombada-Mac.app.tar.gz.sig
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/quadro-v')
    needs: [compilar, compilar-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Quadro-Lombada-Setup
          path: instalador

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Quadro-Lombada-Mac
          path: instalador

      - name: Conferir o SHA256 dos artefatos
        working-directory: instalador
        run: sha256sum -c Quadro-Lombada-Setup.exe.sha256 Quadro-Lombada-Mac.dmg.sha256

      - name: latest.json (o programa instalado lê para se atualizar)
        working-directory: instalador
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          jq -n --arg v "${TAG#quadro-v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg b "$base" \
            --rawfile win Quadro-Lombada-Setup.exe.sig --rawfile mac Quadro-Lombada-Mac.app.tar.gz.sig \
            '{version: $v, notes: "Quadro da portaria \($v)", pub_date: $d, platforms: {
               "windows-x86_64": {signature: ($win | rtrimstr("\n")), url: ($b + "/Quadro-Lombada-Setup.exe")},
               "darwin-aarch64": {signature: ($mac | rtrimstr("\n")), url: ($b + "/Quadro-Lombada-Mac.app.tar.gz")},
               "darwin-x86_64":  {signature: ($mac | rtrimstr("\n")), url: ($b + "/Quadro-Lombada-Mac.app.tar.gz")}}}' > latest.json
          cat latest.json

      - name: Release da tag (cria ou atualiza)
        working-directory: instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Quadro da portaria $TAG" \
              --notes "Instaladores do Quadro da portaria para Windows (.exe) e Mac (.dmg). Baixe pelo painel: menu da conta > Quadro para o PC da portaria. SHA256 nos arquivos .sha256." \
              --latest
          fi
          gh release upload "$TAG" Quadro-Lombada-Setup.exe Quadro-Lombada-Setup.exe.sha256 \
            Quadro-Lombada-Mac.dmg Quadro-Lombada-Mac.dmg.sha256 \
            Quadro-Lombada-Mac.app.tar.gz Quadro-Lombada-Mac.app.tar.gz.sig latest.json --clobber
