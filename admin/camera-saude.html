<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Saúde da câmera — Protector Lombada</title>
  <link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E📷%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #046BD2;
      --ok: #059669;
      --warn: #d97706;
      --err: #dc2626;
      --offline: #475569;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header a { color: var(--accent); text-decoration: none; font-size: 13px; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 60px; }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: 1fr; }
    @media (min-width: 760px) { .grid-2 { grid-template-columns: 2fr 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px;
    }
    .dot.online { background: var(--ok); }
    .dot.atrasada { background: var(--warn); }
    .dot.offline { background: var(--err); }
    .dot.nunca_conectou { background: var(--offline); }
    .status-label { font-weight: 600; font-size: 18px; }
    .atraso { color: var(--muted); font-size: 13px; }

    .alert {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 10px 12px;
      color: #78350f;
      font-size: 13px;
      margin-top: 12px;
    }
    .alert.ok {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #14532d;
    }

    table.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.kv th, table.kv td {
      padding: 7px 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }
    table.kv th { color: var(--muted); font-weight: 500; width: 42%; }
    table.kv td { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; word-break: break-all; }
    table.kv td.muted { color: var(--muted); font-style: italic; font-family: inherit; }

    .vols {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .vol-box {
      text-align: center;
      padding: 10px 8px;
      background: var(--bg);
      border-radius: 6px;
    }
    .vol-num { font-size: 22px; font-weight: 700; color: var(--text); }
    .vol-lab { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

    .spark-wrap {
      display: flex; align-items: end; gap: 2px;
      height: 56px; padding: 4px 0; margin-top: 8px;
    }
    .spark-bar {
      flex: 1; min-width: 2px;
      background: var(--accent);
      border-radius: 1px;
      opacity: 0.85;
      transition: opacity 0.15s;
    }
    .spark-bar:hover { opacity: 1; }
    .spark-bar.zero { background: var(--border); }
    .spark-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

    table.caps { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
    table.caps th, table.caps td {
      padding: 7px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    table.caps th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    table.caps td.placa { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; }
    table.caps td.vel { text-align: right; }

    .loading, .error {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }
    .error { color: var(--err); }
  </style>
</head>
<body>
  <header>
    <a href="/admin">← Admin</a>
    <h1 id="page-title">Saúde da câmera</h1>
  </header>
  <main id="main">
    <div class="loading">Carregando…</div>
  </main>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const cameraId = params.get('id');
    const main = document.getElementById('main');

    if (!cameraId) {
      main.innerHTML = '<div class="error">Falta parâmetro <code>?id=&lt;uuid&gt;</code></div>';
      throw new Error('camera id missing');
    }

    function fmtAtraso(seg) {
      if (seg == null) return '—';
      if (seg < 60) return seg + 's';
      if (seg < 3600) return Math.floor(seg / 60) + 'min';
      if (seg < 86400) return Math.floor(seg / 3600) + 'h';
      return Math.floor(seg / 86400) + 'd';
    }

    function fmtData(ts) {
      if (!ts) return '—';
      try {
        return new Date(ts).toLocaleString('pt-BR', { timeZone: 'America/Bahia' });
      } catch { return ts; }
    }

    function statusLabel(s) {
      return {
        online: 'Online',
        atrasada: 'Atrasada',
        offline: 'Offline',
        nunca_conectou: 'Nunca conectou',
      }[s] || s;
    }

    async function getToken() {
      // Reusa o mesmo padrão dos outros admins do projeto
      return localStorage.getItem('supabase_access_token') || sessionStorage.getItem('supabase_access_token');
    }

    async function loadHealth() {
      const token = await getToken();
      if (!token) {
        main.innerHTML = '<div class="error">Sem sessão. <a href="/admin">Faça login</a>.</div>';
        return;
      }
      const r = await fetch('/api/admin/camera-health?id=' + encodeURIComponent(cameraId), {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        main.innerHTML = `<div class="error">${r.status}: ${e.error || 'Erro ao carregar'}</div>`;
        return;
      }
      const d = await r.json();
      render(d);
    }

    function render(d) {
      const cam = d.camera, cli = d.cliente, st = d.status, vol = d.volumes;
      document.getElementById('page-title').textContent = `Saúde: ${cam.nome_exibicao || cam.nome}`;

      const spark = (d.sparkline_30d || []).map(p =>
        `<div class="spark-bar ${p.count === 0 ? 'zero' : ''}"
              style="height: ${Math.max(2, (p.count / Math.max(1, Math.max(...(d.sparkline_30d || []).map(x => x.count)))) * 56)}px"
              title="${p.day}: ${p.count} capturas"></div>`
      ).join('');

      const sparkLabels = `<div class="spark-labels">
        <span>${d.sparkline_30d?.[0]?.day || '30d atrás'}</span>
        <span>hoje</span>
      </div>`;

      const ultimas = (d.ultimas_capturas || []).map(c => `
        <tr>
          <td>${fmtData(c.timestamp)}</td>
          <td class="placa">${c.placa || '—'}</td>
          <td class="vel">${c.velocidade != null ? c.velocidade + ' km/h' : '—'}</td>
        </tr>
      `).join('') || '<tr><td colspan="3" style="color:var(--muted);text-align:center;padding:18px;">Nenhuma captura registrada</td></tr>';

      const alertaEndpoint = st.endpoint_alerta
        ? `<div class="alert">⚠ Endpoint configurado na câmera é <code>${cam.endpoint_configurado}</code>. O recomendado é <code>${st.endpoint_recomendado}</code> — câmeras em <code>.vercel.app</code> raw têm problemas de TLS/SNI. Reconfigurar Servidor Pri. no QLPR Config.</div>`
        : cam.endpoint_configurado
        ? `<div class="alert ok">✓ Endpoint configurado: <code>${cam.endpoint_configurado}</code></div>`
        : `<div class="alert">Endpoint configurado ainda não detectado (aguarde próximo heartbeat).</div>`;

      main.innerHTML = `
        <div class="grid grid-2">
          <div class="card">
            <h2>Status agora</h2>
            <div class="status-row">
              <span class="dot ${st.agora}"></span>
              <span class="status-label">${statusLabel(st.agora)}</span>
              <span class="atraso">${st.atraso_segundos != null ? '— último contato ' + fmtAtraso(st.atraso_segundos) + ' atrás' : ''}</span>
            </div>
            ${alertaEndpoint}
          </div>
          <div class="card">
            <h2>Cliente</h2>
            <table class="kv">
              <tr><th>Condomínio</th><td>${cli?.nome || '—'}</td></tr>
              <tr><th>Local/Via</th><td>${cli?.local_via || '—'}</td></tr>
              <tr><th>Cidade/UF</th><td>${cli?.cidade_uf || '—'}</td></tr>
              <tr><th>Limite</th><td>${cli?.limite_velocidade != null ? cli.limite_velocidade + ' km/h' : '—'}</td></tr>
            </table>
          </div>

          <div class="card">
            <h2>Telemetria da câmera</h2>
            <table class="kv">
              <tr><th>Nome interno</th><td>${cam.nome}</td></tr>
              <tr><th>Serial</th><td>${cam.serial_number || '—'}</td></tr>
              <tr><th>Modelo</th><td>${cam.modelo || '<span class="muted">não cadastrado</span>'}</td></tr>
              <tr><th>Firmware</th><td>${cam.firmware_versao || '<span class="muted">não capturado</span>'}</td></tr>
              <tr><th>IP local (visto pela rede)</th><td>${cam.ip_address || '—'}</td></tr>
              <tr><th>IP local (reportado pela câmera)</th><td>${cam.host_camera_reportado || '<span class="muted">aguarda heartbeat</span>'}</td></tr>
              <tr><th>MAC</th><td>${cam.mac_address || '—'}</td></tr>
              <tr><th>Endpoint configurado</th><td>${cam.endpoint_configurado || '<span class="muted">aguarda heartbeat</span>'}</td></tr>
              <tr><th>Boot da câmera</th><td>${cam.uptime_start_ts || '<span class="muted">aguarda heartbeat</span>'}</td></tr>
              <tr><th>Último outage reportado</th><td>${cam.ultimo_outage_reportado || '<span class="muted">aguarda heartbeat</span>'}</td></tr>
              <tr><th>Heartbeat countid</th><td>${cam.heartbeat_countid != null ? cam.heartbeat_countid : '<span class="muted">aguarda heartbeat</span>'}</td></tr>
              <tr><th>Cadastrada em</th><td>${fmtData(cam.criado_em)}</td></tr>
              <tr><th>Último contato</th><td>${fmtData(cam.last_seen)}</td></tr>
            </table>
          </div>
          <div class="card">
            <h2>Volume de capturas</h2>
            <div class="vols">
              <div class="vol-box"><div class="vol-num">${vol.cap24h}</div><div class="vol-lab">24h</div></div>
              <div class="vol-box"><div class="vol-num">${vol.cap7d}</div><div class="vol-lab">7 dias</div></div>
              <div class="vol-box"><div class="vol-num">${vol.cap30d}</div><div class="vol-lab">30 dias</div></div>
            </div>
            <h2 style="margin-top:16px">Capturas por dia (30d)</h2>
            <div class="spark-wrap">${spark || '<span class="muted">sem dados</span>'}</div>
            ${sparkLabels}
          </div>

          <div class="card" style="grid-column: 1 / -1">
            <h2>Últimas 20 capturas</h2>
            <table class="caps">
              <thead><tr><th>Quando</th><th>Placa</th><th>Velocidade</th></tr></thead>
              <tbody>${ultimas}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    loadHealth();
  </script>
</body>
</html>
