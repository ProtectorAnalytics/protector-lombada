<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico de Câmera — Protector Traffic Control</title>
  <link rel="icon" type="image/png" href="https://appps.com.br/assets/logo-protector.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #F0F5FA;
      --card: #FFFFFF;
      --accent: #046bd2;
      --accent-light: #e8f1fb;
      --text: #1e293b;
      --text-2: #64748b;
      --text-3: #94a3b8;
      --border: #e2e8f0;
      --green: #16a34a;
      --amber: #ea580c;
      --red: #dc2626;
      --blue: #046bd2;
      --green-bg: #dcfce7;
      --amber-bg: #fed7aa;
      --red-bg: #fee2e2;
      --blue-bg: #dbeafe;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .topbar a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .topbar a:hover { text-decoration: underline; }
    h1 { font-size: 22px; font-weight: 700; margin: 0; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--text); }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    /* Status pill */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; }
    .pill.verde { background: var(--green-bg); color: var(--green); }
    .pill.verde .dot { background: var(--green); }
    .pill.amarelo { background: var(--amber-bg); color: var(--amber); }
    .pill.amarelo .dot { background: var(--amber); }
    .pill.vermelho { background: var(--red-bg); color: var(--red); }
    .pill.vermelho .dot { background: var(--red); }
    .pill.azul { background: var(--blue-bg); color: var(--blue); }
    .pill.azul .dot { background: var(--blue); }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .meta-item .label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
    .meta-item .value { font-size: 14px; font-weight: 500; word-break: break-word; }

    /* Achados */
    .achado {
      border-left: 4px solid;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: #fafbfc;
      border-radius: 4px;
    }
    .achado.ok { border-color: var(--green); background: var(--green-bg); }
    .achado.baixo { border-color: var(--blue); background: var(--blue-bg); }
    .achado.medio { border-color: var(--amber); background: #fef3c7; }
    .achado.alto, .achado.critico { border-color: var(--red); background: var(--red-bg); }
    .achado .titulo { font-weight: 600; margin-bottom: 4px; }
    .achado .desc { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
    .achado ul { padding-left: 20px; font-size: 13px; }
    .achado ul li { margin-bottom: 4px; }

    /* Stats grid */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .stat {
      background: var(--accent-light);
      padding: 14px;
      border-radius: 8px;
    }
    .stat .num { font-size: 24px; font-weight: 700; color: var(--accent); }
    .stat .lbl { font-size: 12px; color: var(--text-2); margin-top: 2px; }

    /* Timeline */
    .timeline {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 120px;
      margin-top: 8px;
    }
    .tl-bar {
      flex: 1;
      display: flex;
      flex-direction: column-reverse;
      gap: 1px;
      min-width: 8px;
      position: relative;
    }
    .tl-bar:hover .tl-tooltip { display: block; }
    .tl-tooltip {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }
    .tl-seg { width: 100%; }
    .tl-seg.h { background: var(--blue); }
    .tl-seg.c { background: var(--green); }
    .tl-seg.e { background: var(--red); }
    .tl-legend { display: flex; gap: 14px; font-size: 12px; margin-top: 8px; color: var(--text-2); }
    .tl-legend span { display: inline-flex; align-items: center; gap: 4px; }
    .tl-legend .sw { width: 10px; height: 10px; border-radius: 2px; }

    /* Tabela */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:hover td { background: #fafbfc; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge.suc { background: var(--green-bg); color: var(--green); }
    .badge.err { background: var(--red-bg); color: var(--red); }
    .badge.hb { background: var(--blue-bg); color: var(--blue); }
    .badge.pl { background: var(--accent-light); color: var(--accent); }

    .loading, .error { text-align: center; padding: 40px; color: var(--text-2); }
    .error { color: var(--red); }
    code { background: #f1f5f9; padding: 1px 6px; border-radius: 3px; font-size: 12px; }

    @media (max-width: 768px) {
      .container { padding: 12px; }
      .card { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a href="/admin">← Voltar ao painel</a>
      <h1 id="titulo">Diagnóstico da câmera</h1>
      <span id="status-pill"></span>
      <button onclick="loadDiagnostico()" style="margin-left: auto; padding: 6px 12px; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; font-size: 13px;">Atualizar</button>
    </div>

    <div id="content"><div class="loading">Carregando...</div></div>
  </div>

  <script>
    let sb = null;
    let authToken = null;
    const cameraId = new URLSearchParams(location.search).get('camera_id') || new URLSearchParams(location.search).get('id');

    async function init() {
      if (!cameraId) {
        document.getElementById('content').innerHTML = '<div class="error">camera_id não informado na URL</div>';
        return;
      }
      const cfg = await fetch('/api/config').then(r => r.json());
      sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        document.getElementById('content').innerHTML = '<div class="error">Não autenticado. <a href="/admin">Faça login</a> primeiro.</div>';
        return;
      }
      authToken = session.access_token;
      await loadDiagnostico();
    }

    async function loadDiagnostico() {
      document.getElementById('content').innerHTML = '<div class="loading">Carregando diagnóstico...</div>';
      try {
        const resp = await fetch('/api/admin/diagnostico?camera_id=' + encodeURIComponent(cameraId), {
          headers: { 'Authorization': 'Bearer ' + authToken },
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Erro');
        render(data);
      } catch (err) {
        document.getElementById('content').innerHTML = '<div class="error">Erro: ' + (err.message || err) + '</div>';
      }
    }

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function fmtAgo(iso) {
      if (!iso) return '—';
      const min = (Date.now() - new Date(iso).getTime()) / 60000;
      if (min < 1) return 'agora';
      if (min < 60) return Math.round(min) + ' min atrás';
      if (min < 1440) return Math.round(min / 60) + ' h atrás';
      return Math.round(min / 1440) + ' dias atrás';
    }

    function render(d) {
      const camNome = d.camera.nome_exibicao || d.camera.nome || d.camera.serial_number || d.camera.id;
      document.getElementById('titulo').textContent = camNome;
      document.getElementById('status-pill').innerHTML =
        `<span class="pill ${esc(d.status.cor)}"><span class="dot"></span>${esc(d.status.label)}${d.status.minutos_desde != null ? ' · ' + d.status.minutos_desde + ' min' : ''}</span>`;

      let html = '';

      // 1. Meta da câmera
      html += `<div class="card">
        <h2>Informações da câmera</h2>
        <div class="meta">
          <div class="meta-item"><div class="label">Nome</div><div class="value">${esc(d.camera.nome || '—')}</div></div>
          <div class="meta-item"><div class="label">Exibição</div><div class="value">${esc(d.camera.nome_exibicao || '—')}</div></div>
          <div class="meta-item"><div class="label">Serial</div><div class="value"><code>${esc(d.camera.serial_number || '—')}</code></div></div>
          <div class="meta-item"><div class="label">Modelo / Firmware</div><div class="value">${esc(d.camera.modelo || '—')} / ${esc(d.camera.firmware || '—')}</div></div>
          <div class="meta-item"><div class="label">IP declarado</div><div class="value"><code>${esc(d.camera.ip_address || '—')}</code></div></div>
          <div class="meta-item"><div class="label">MAC</div><div class="value"><code>${esc(d.camera.mac_address || '—')}</code></div></div>
          <div class="meta-item"><div class="label">Último sinal</div><div class="value">${fmtAgo(d.camera.last_seen)}<div style="font-size:11px;color:var(--text-3)">${fmtDate(d.camera.last_seen)}</div></div></div>
          <div class="meta-item"><div class="label">Última captura</div><div class="value">${d.ultima_captura ? (esc(d.ultima_captura.placa) + ' · ' + d.ultima_captura.velocidade + ' km/h<div style="font-size:11px;color:var(--text-3)">' + fmtAgo(d.ultima_captura.timestamp) + '</div>') : '—'}</div></div>
          <div class="meta-item"><div class="label">Ativa</div><div class="value">${d.camera.ativa ? 'Sim' : 'Não'}</div></div>
        </div>
      </div>`;

      // 2. Veredicto / achados
      html += `<div class="card">
        <h2>Veredicto (últimas 24h)</h2>
        ${d.veredicto.achados.map(a => `
          <div class="achado ${esc(a.severidade)}">
            <div class="titulo">${esc(a.titulo)}</div>
            <div class="desc">${esc(a.descricao)}</div>
            ${a.acoes.length > 0 ? '<ul>' + a.acoes.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : ''}
          </div>
        `).join('')}
      </div>`;

      // 3. Stats
      const s = d.stats_24h;
      const breakdownErros = Object.entries(s.por_motivo || {}).sort((a, b) => b[1] - a[1]);
      html += `<div class="card">
        <h2>Estatísticas (últimas 24h)</h2>
        <div class="stats">
          <div class="stat"><div class="num">${s.total}</div><div class="lbl">Requisições</div></div>
          <div class="stat"><div class="num">${s.placas_capturadas}</div><div class="lbl">Capturas válidas</div></div>
          <div class="stat"><div class="num">${s.por_tipo.heartbeat || 0}</div><div class="lbl">Heartbeats</div></div>
          <div class="stat"><div class="num" style="color:var(--red)">${s.erros}</div><div class="lbl">Erros</div></div>
          <div class="stat"><div class="num">${s.latencia_p50_ms != null ? s.latencia_p50_ms + 'ms' : '—'}</div><div class="lbl">Latência p50</div></div>
          <div class="stat"><div class="num">${s.latencia_p95_ms != null ? s.latencia_p95_ms + 'ms' : '—'}</div><div class="lbl">Latência p95</div></div>
        </div>
        ${breakdownErros.length > 0 ? `<div style="margin-top:16px"><h2>Erros por motivo</h2>
          <table><thead><tr><th>Motivo</th><th>Quantidade</th></tr></thead><tbody>
          ${breakdownErros.map(([m, n]) => `<tr><td><code>${esc(m)}</code></td><td>${n}</td></tr>`).join('')}
          </tbody></table></div>` : ''}
        ${Object.keys(s.ips_origem || {}).length > 0 ? `<div style="margin-top:16px"><h2>IPs origem</h2>
          <table><thead><tr><th>IP</th><th>Requisições</th></tr></thead><tbody>
          ${Object.entries(s.ips_origem).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([ip,n]) => `<tr><td><code>${esc(ip)}</code></td><td>${n}</td></tr>`).join('')}
          </tbody></table></div>` : ''}
      </div>`;

      // 4. Timeline
      const maxBucket = Math.max(1, ...d.timeline.map(b => b.heartbeats + b.capturas + b.erros));
      html += `<div class="card">
        <h2>Timeline horária (24h)</h2>
        <div class="timeline">
          ${d.timeline.map(b => {
            const h = new Date(b.hora).getHours();
            const total = b.heartbeats + b.capturas + b.erros;
            const altura = total === 0 ? 0 : Math.max(2, (total / maxBucket) * 100);
            return `<div class="tl-bar" style="height:${altura}%">
              ${b.erros > 0 ? `<div class="tl-seg e" style="height:${(b.erros/total)*100}%"></div>` : ''}
              ${b.heartbeats > 0 ? `<div class="tl-seg h" style="height:${(b.heartbeats/total)*100}%"></div>` : ''}
              ${b.capturas > 0 ? `<div class="tl-seg c" style="height:${(b.capturas/total)*100}%"></div>` : ''}
              <div class="tl-tooltip">${String(h).padStart(2,'0')}h<br>${b.capturas} cap · ${b.heartbeats} hb · ${b.erros} err</div>
            </div>`;
          }).join('')}
        </div>
        <div class="tl-legend">
          <span><span class="sw" style="background:var(--green)"></span>Capturas</span>
          <span><span class="sw" style="background:var(--blue)"></span>Heartbeats</span>
          <span><span class="sw" style="background:var(--red)"></span>Erros</span>
        </div>
      </div>`;

      // 5. Eventos órfãos (se houver)
      if (d.eventos_orfaos && d.eventos_orfaos.length > 0) {
        html += `<div class="card">
          <h2>⚠ Requisições com este serial mas sem câmera vinculada</h2>
          <p style="color:var(--text-2);margin-bottom:10px;font-size:13px">A câmera enviou pacotes com o serial certo, mas em momentos sem cadastro ativo.</p>
          <table><thead><tr><th>Quando</th><th>Tipo</th><th>Motivo</th><th>IP origem</th></tr></thead><tbody>
          ${d.eventos_orfaos.map(e => `<tr>
            <td>${fmtDate(e.ts)}</td>
            <td><span class="badge ${e.tipo === 'placa' ? 'pl' : 'hb'}">${esc(e.tipo)}</span></td>
            <td><code>${esc(e.motivo || '—')}</code></td>
            <td><code>${esc(e.ip_origem || '—')}</code></td>
          </tr>`).join('')}
          </tbody></table>
        </div>`;
      }

      // 6. Últimos eventos
      html += `<div class="card">
        <h2>Últimos 50 eventos</h2>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Quando</th><th>Tipo</th><th>Resultado</th><th>Motivo</th><th>HTTP</th><th>Placa</th><th>IP origem</th><th>IP payload</th><th>ms</th></tr></thead>
            <tbody>
            ${d.eventos.map(e => `<tr>
              <td>${fmtDate(e.ts)}</td>
              <td><span class="badge ${e.tipo === 'placa' ? 'pl' : 'hb'}">${esc(e.tipo)}</span></td>
              <td><span class="badge ${e.resultado === 'sucesso' ? 'suc' : 'err'}">${esc(e.resultado)}</span></td>
              <td>${e.motivo ? '<code>' + esc(e.motivo) + '</code>' : '—'}</td>
              <td>${e.http_status}</td>
              <td>${esc(e.placa || '—')}</td>
              <td><code style="font-size:11px">${esc(e.ip_origem || '—')}</code></td>
              <td><code style="font-size:11px">${esc(e.ip_payload || '—')}</code></td>
              <td>${e.latencia_ms != null ? e.latencia_ms : '—'}</td>
            </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;

      document.getElementById('content').innerHTML = html;
    }

    init();
  </script>
</body>
</html>
